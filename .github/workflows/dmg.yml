name: dmg

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        run: bash scripts/build-dmg.sh

      - name: Upload DMG artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: DoomStatus-dmg
          path: dist/DoomStatus.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/DoomStatus.dmg \
            --title "${GITHUB_REF_NAME}" \
            --notes "Instalador arm64 de Doom Status para macOS 14 o posterior (Apple Silicon). La primera vez, ábrelo con clic derecho."
